# 保留外层反向代理（如宿主机 Nginx / Caddy 终止 HTTPS）传入的协议与端口
map $http_x_forwarded_proto $gc_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 客户端实际访问端口：优先取 Host 中的端口，其次是外层代理的 X-Forwarded-Port。
# 两者都没有时不发送该头（nginx 对空值不转发），后端按默认 80 处理。
# 这一步决定后端能否把请求识别为同源，配错会导致 POST 返回 403 Invalid CORS request。
map $http_host $gc_host_port {
    "~:(?<gc_host_port_number>[0-9]+)$" $gc_host_port_number;
    default                             "";
}

map $http_x_forwarded_port $gc_forwarded_port {
    default $http_x_forwarded_port;
    ""      $gc_host_port;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 构建产物带内容哈希，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 实时事件流：必须关闭缓冲与超时
    location = /api/chat/stream {
        proxy_pass http://server:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $gc_forwarded_port;
        proxy_set_header X-Forwarded-Proto $gc_forwarded_proto;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://server:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $gc_forwarded_port;
        proxy_set_header X-Forwarded-Proto $gc_forwarded_proto;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
