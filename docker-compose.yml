name: game-companion

services:
  mysql:
    image: mysql:8.0
    container_name: gc-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-game_companion}
      MYSQL_USER: ${MYSQL_USER:-game_companion}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据目录为空（首次启动）时执行；脚本含 DROP TABLE，禁止用于存量库
      - ./server/src/main/resources/init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: gc-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: game-companion/server:latest
    container_name: gc-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      # Nginx 会传 X-Forwarded-*，交给 Spring 还原协议与端口，保证上传文件 URL 正确
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1g -XX:+UseG1GC}

      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-game_companion}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-game_companion}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0

      WEB_BASE_URL: ${WEB_BASE_URL:-https://your-domain.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://your-domain.example}

      PLATFORM_PAYMENT_MODE: ${PLATFORM_PAYMENT_MODE:-wechat}
      PLATFORM_DEV_TOOLS_ENABLED: "false"
      AUTH_MOCK_LOGIN_ENABLED: "false"
      KNIFE4J_ENABLE: "false"

      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NICKNAME: ${BOOTSTRAP_ADMIN_NICKNAME:-平台管理员}

      WX_PAY_APP_ID: ${WX_PAY_APP_ID:-}
      WX_PAY_MCH_ID: ${WX_PAY_MCH_ID:-}
      WX_PAY_API_V3_KEY: ${WX_PAY_API_V3_KEY:-}
      WX_PAY_KEY_PATH: ${WX_PAY_KEY_PATH:-/opt/certs/apiclient_key.pem}
      WX_PAY_CERT_PATH: ${WX_PAY_CERT_PATH:-/opt/certs/apiclient_cert.pem}
      WX_PAY_NOTIFY_URL: ${WX_PAY_NOTIFY_URL:-}
      WX_PAY_WEB_APP_URL: ${WX_PAY_WEB_APP_URL:-}
      WX_PAY_TRANSFER_SCENE_ID: ${WX_PAY_TRANSFER_SCENE_ID:-}
    volumes:
      - uploads:/app/uploads
      # 商户证书目录，宿主机不存在时 Docker 会创建空目录；未配置微信支付时留空即可
      - ./docker/certs:/opt/certs:ro
    networks:
      - backend

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: game-companion/web:latest
    container_name: gc-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    networks:
      - backend

volumes:
  mysql-data:
  redis-data:
  uploads:

networks:
  backend:
    driver: bridge
