# HTTPS 覆盖配置：在容器内直接终止 TLS
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# 证书放在宿主机 docker/ssl/ 下：
#   docker/ssl/fullchain.pem
#   docker/ssl/privkey.pem

services:
  web:
    # Compose 会追加端口映射，与基础文件的 80 端口共存
    ports:
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./web/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
